[project]
name = "gg-first-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "ollama>=0.6.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: 使用数据库或多个应用组件的集成测试",
    "postgres: 必须连接真实 PostgreSQL 或 pgvector 的测试",
    "ollama: 必须连接真实 Ollama 服务的测试",
    "e2e: 验证完整业务流程的端到端测试",
]
