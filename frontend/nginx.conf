# 文件职责：提供前端静态文件，并代理后端接口。
# 作用与配合：由前端Docker镜像安装到Nginx配置目录。
# 边界：页面路由交给React，接口权限仍由后端校验。

# 定义后端服务组，并跟踪Docker内部DNS中的地址变化。
upstream ticketpilot_api {
    # 保存可动态更新的上游状态，供Nginx工作进程共享。
    zone ticketpilot_api 64k;

    # 使用Docker内置DNS，解析结果缓存10秒。
    # 当前演示网络使用IPv4，因此关闭IPv6查询。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # resolve表示持续跟踪backend的地址变化。
    server backend:8000 resolve;
}

server {
    # Nginx在容器内部监听80端口。
    listen 80;
    server_name _;

    # 前端构建产物在容器中的存放位置。
    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限略大于后端5MiB文件限制，留出表单开销。
    # 后端仍负责执行真正的文件大小校验。
    client_max_body_size 6m;

    # 接口请求转发给Compose中的backend服务。
    location /v1/ {
               # 转发到上方定义的后端服务组，保留完整请求路径。
        proxy_pass http://ticketpilot_api;

        proxy_http_version 1.1;

        # 向后端传递请求主机、访问协议及代理链信息。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 本机模型响应可能较慢，放宽读取响应的等待时间。
        proxy_read_timeout 300s;
    }

    # 构建生成的资源必须真实存在，缺失就返回404。
    location /assets/ {
        try_files $uri =404;
    }

    # 页面请求：优先读取真实文件，否则返回React入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}